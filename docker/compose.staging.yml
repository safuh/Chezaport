services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      APP_NAME: ${APP_NAME:-Chezaport Staging}
      APP_VERSION: ${APP_VERSION:-0.1.0}
      ENVIRONMENT: staging
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set to a staging PostgreSQL database}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_JSON: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
    ports:
      - "127.0.0.1:${APP_PORT:-8001}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
